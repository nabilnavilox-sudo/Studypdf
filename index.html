<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPDF - Révise plus vite avec l'IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">SP</div>
        <span class="font-bold text-slate-900">StudyPDF</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-slate-900 sm:text-4xl">Révise plus vite, avec l'IA</h1>
      <p class="mt-2 text-slate-600">Importe le PDF de ton cours pour générer résumé, fiche de révision, QCM et poser tes questions au Chat.</p>
    </div>

    <!-- Drop Zone -->
    <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-2xl bg-white p-8 text-center cursor-pointer hover:border-indigo-500 transition-colors">
      <input type="file" id="fileInput" accept="application/pdf" class="hidden" />
      <div class="text-4xl mb-2">📄</div>
      <p class="font-semibold text-slate-700">Dépose ton PDF ici</p>
      <p class="text-xs text-slate-400 mt-1">ou appuie pour choisir un fichier</p>
    </div>

    <!-- File Info & Options -->
    <div id="fileInfoCard" class="hidden mt-4 bg-white rounded-2xl p-4 border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <div>
          <p id="fileName" class="font-semibold text-slate-800 text-sm truncate max-w-xs"></p>
          <p id="fileSize" class="text-xs text-slate-400"></p>
        </div>
      </div>
      <div class="flex gap-2 mb-4">
        <button data-lang="fr" class="lang-btn flex-1 py-2 border rounded-xl text-xs font-semibold active border-indigo-600 bg-indigo-50 text-indigo-600">Français</button>
        <button data-lang="ar" class="lang-btn flex-1 py-2 border rounded-xl text-xs font-semibold">العربية</button>
        <button data-lang="darija" class="lang-btn flex-1 py-2 border rounded-xl text-xs font-semibold">Darija</button>
      </div>
      <button id="analyzeBtn" class="w-full py-3 bg-indigo-600 text-white font-bold text-sm rounded-xl hover:bg-indigo-700">Analyser mon cours</button>
    </div>

    <!-- Status Box -->
    <div id="statusCard" class="hidden mt-4 p-4 rounded-xl text-sm font-medium"></div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden mt-8 space-y-6">
      <div id="resumeContent" class="bg-white p-6 rounded-2xl border border-slate-200"></div>
      <div id="ficheContent" class="bg-white p-6 rounded-2xl border border-slate-200"></div>
      <div id="qcmContent" class="bg-white p-6 rounded-2xl border border-slate-200"></div>
      <div id="flashcardsContent" class="bg-white p-6 rounded-2xl border border-slate-200"></div>
    </div>

    <!-- Chat Section -->
    <section id="chatSection" class="mt-8 bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hidden">
      <div class="flex items-center space-x-2 mb-4">
        <span class="text-xl">💬</span>
        <h2 class="text-lg font-bold text-slate-900">Pose tes questions sur le cours</h2>
      </div>
      <div id="chatMessages" class="h-64 overflow-y-auto space-y-3 p-3 bg-slate-50 rounded-xl mb-4 border border-slate-100 text-sm">
        <div class="p-3 bg-slate-200 text-slate-700 rounded-xl max-w-[85%] mr-auto">
          Pose-moi n'importe quelle question sur ton cours !
        </div>
      </div>
      <form id="chatForm" class="flex gap-2">
        <input type="text" id="chatInput" placeholder="Ex: Explique la formule de la page 2..." class="flex-1 px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600" required />
        <button type="submit" class="px-5 py-3 bg-indigo-600 text-white font-medium text-sm rounded-xl">Envoyer</button>
      </form>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
