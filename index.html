<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyPDF</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAFAFB;
    --surface: #FFFFFF;
    --surface-alt: #F3F4F6;
    --border: #E5E7EB;
    --text: #16161A;
    --text-secondary: #6B7280;
    --text-tertiary: #9CA3AF;
    --accent: #6366F1;
    --accent-hover: #4F46E5;
    --accent-soft: #EEF0FF;
    --success: #10B981;
    --success-soft: #ECFDF5;
    --error: #EF4444;
    --error-soft: #FEF2F2;
    --info-soft: #EFF6FF;
    --info-text: #1E40AF;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 4px 10px rgba(16,24,40,0.05);
  }

  html[data-theme="dark"] {
    --bg: #101014;
    --surface: #18181D;
    --surface-alt: #1F1F26;
    --border: #2A2A33;
    --text: #F4F4F5;
    --text-secondary: #A1A1AA;
    --text-tertiary: #71717A;
    --accent: #818CF8;
    --accent-hover: #6366F1;
    --accent-soft: #23233A;
    --success: #34D399;
    --success-soft: #14261F;
    --error: #F87171;
    --error-soft: #2A1416;
    --info-soft: #16233A;
    --info-text: #93C5FD;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 18px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 768px) {
    .app { max-width: 600px; padding: 0 24px 56px; }
  }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 8px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: -0.02em;
  }
  .brand-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .theme-toggle {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .theme-toggle:active { transform: scale(0.94); }
  .theme-toggle svg { width: 17px; height: 17px; }
  .icon-sun { display: none; }
  html[data-theme="dark"] .icon-moon { display: none; }
  html[data-theme="dark"] .icon-sun { display: block; }

  /* ---------- Hero ---------- */
  .hero { padding: 28px 0 8px; }
  .hero h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  @media (min-width: 768px) { .hero h1 { font-size: 38px; } }
  .hero p {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.55;
    max-width: 42ch;
    margin-bottom: 24px;
  }
